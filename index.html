<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>魚言図鑑</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- ヘッダーエリア -->
    <header>
      <div class="header-image-container">
        <img src="top-image.png" alt="釣っとこどんどん 偏愛Tool" class="header-img">
      </div>
      <h1 class="main-title">言魚図鑑</h1>
      <p class="subtitle">〜 釣った言葉を嗜むノート 〜</p>
    </header>

    <!-- 入力フォームエリア（保存ボタンは右下ボタンに集約） -->
    <section class="form-section">
      <h2 class="section-title">言葉を釣る（新規登録）</h2>
      <form id="word-form">
        <div class="form-group">
          <input type="text" id="word-input" placeholder="釣った言葉（例：泰然自若）" required autocomplete="off">
        </div>

        <div class="form-group">
          <input type="text" id="reading-input" placeholder="読み（例：たいぜんじじゃく）" autocomplete="off">
        </div>

        <div class="form-group">
          <textarea id="meaning-input" rows="3" placeholder="意味やメモ"></textarea>
        </div>

        <div class="form-group">
          <input type="url" id="url-input" placeholder="参照リンクURL">
        </div>

        <div class="form-group">
          <input type="text" id="tag-input" placeholder="タグ（カンマ区切りで複数入力OK）">
        </div>

        <!-- JSからの送信イベント用（隠し送信ボタン） -->
        <button type="submit" id="save-btn" style="display: none;"></button>
      </form>
    </section>

    <!-- 検索エリア -->
    <section class="search-section">
      <input type="text" id="search-input" placeholder="🔍 言葉・読み・メモ・タグから探す...">
    </section>

    <!-- 記録一覧表示エリア（洗練されたタイトル表現） -->
   <!-- 検索エリア -->
<section class="search-section">
  <input type="text" id="search-input" placeholder="🧊 クーラーboxを開ける...">
</section>
  </div>

  <!-- スマホ向け一発保存ボタン -->
  <button type="button" class="floating-save-btn" onclick="document.getElementById('save-btn').click()">
    保存
  </button>

  <script src="script.js"></script>
</body>
</html>
