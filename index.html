<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>言魚図鑑</title>

  <!-- OGP設定（LINEやSNSで共有した時の表示） -->
  <meta property="og:title" content="言魚図鑑">
  <meta property="og:description" content="〜 釣った言葉を嗜むノート 〜">
  <meta property="og:type" content="website">
  <meta property="og:image" content="gengyo.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="gengyo.png">

  <!-- スマホのホーム画面追加（PWA）＆ファビコン設定 -->
  <link rel="icon" href="gengyo.png">
  <link rel="apple-touch-icon" href="gengyo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1c2638">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- ヘッダーエリア -->
    <header>
      <div class="header-image-container">
        <img src="fish.png" alt="言魚図鑑" class="header-img">
      </div>
      <h1 class="main-title">言魚図鑑</h1>
      <p class="subtitle">〜 釣った言葉を嗜むノート 〜</p>
    </header>

    <!-- 入力フォームエリア -->
    <section class="form-section">
      <h2 class="section-title">言葉を釣る（新規登録）</h2>
      <form id="word-form">
        <div class="form-group">
          <input type="text" id="word-input" placeholder="釣った言葉（例：泰然自若）" required autocomplete="off">
        </div>

        <div class="form-group">
          <input type="text" id="reading-input" placeholder="読み（例：たいぜんじじゃく）" autocomplete="off">
        </div>

        <div class="form-group">
          <textarea id="meaning-input" rows="3" placeholder="意味やメモ"></textarea>
        </div>

        <div class="form-group">
          <input type="url" id="url-input" placeholder="参照リンクURL">
        </div>

        <!-- 保存ボタン -->
        <button type="submit" id="save-btn" style="display: none;"></button>
      </form>
    </section>

    <!-- 検索エリア -->
    <section class="search-section">
      <input type="text" id="search-input" placeholder="🔍 言葉・読み・メモから探す...">
    </section>

    <!-- 記録一覧表示エリア -->
    <section class="list-section">
      <h2 class="list-title">🐠 水槽を眺める</h2>
      <div id="word-list" class="word-list">
        <!-- JSでここにカードが追加されます -->
      </div>
    </section>
  </div>

  <!-- スマホ向け一発保存ボタン -->
  <button type="button" class="floating-save-btn" aria-label="釣った言葉を保存する" onclick="document.getElementById('save-btn').click()">
    保存
  </button>

  <script src="script.js"></script>
</body>
</html>
