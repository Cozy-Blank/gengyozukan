<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>魚言図鑑</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="henai-header">
    <div class="hero-image-wrapper">
      <!-- 画像ファイル名を「偏愛魚.png」に修正したよ！ -->
      <img src="偏愛魚.png" alt="魚言図鑑" class="hero-img">
    </div>
    <h1 class="app-title">魚言図鑑</h1>
    <p class="app-subtitle">〜 釣った言葉を嗜む言葉ノート 〜</p>
  </header>

  <main>
    <!-- 1. 新規登録フォーム -->
    <section class="input-form">
      <h2>言葉を釣る（新規登録）</h2>
      <input type="text" id="word-input" placeholder="釣った言葉（例：泰然自若）">
      <input type="text" id="reading-input" placeholder="読み（例：たいぜんじじゃく）">
      <textarea id="meaning-input" placeholder="意味やメモ"></textarea>
      
      <!-- 参照リンク -->
      <input type="url" id="link-input" placeholder="参照リンクURL">

      <!-- タグ入力欄 -->
      <div class="tag-input-group" style="display: flex; gap: 8px; margin-bottom: 8px;">
        <input type="text" id="tag-input" placeholder="タグを入力（例：故事成語）" style="margin-bottom: 0;">
        <button type="button" id="add-tag-btn" style="width: auto; padding: 0 16px; white-space: nowrap;">追加</button>
      </div>
      <div id="selected-tags" class="tag-container" style="margin-bottom: 12px;"></div>

      <!-- 保存ボタン -->
      <button type="button" id="save-btn">ノートに保存する</button>
    </section>

    <!-- 2. 保存ボタンの下：検索・タグ絞り込みエリア -->
    <section class="search-section">
      <h2 class="filter-title">タグやキーワード（語句のうろ覚え検索）で絞り込む</h2>
      <input type="text" id="search-input" placeholder="言葉・読み・意味で検索...">
      <div id="filter-tags" class="tag-container"></div>
    </section>

    <!-- 3. 言葉一覧エリア -->
    <section id="word-list" class="word-list-section"></section>
  </main>

  <script src="main.js"></script>
</body>
</html>
