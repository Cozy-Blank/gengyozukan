<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>魚言図鑑</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>🐟 魚言図鑑</h1>
      <p class="subtitle">心にひっかかった言葉を釣り上げて記録しよう</p>
    </header>

    <!-- 入力フォームエリア -->
    <section class="form-section">
      <form id="word-form">
        <div class="form-group">
          <label for="word-input">釣った言葉 <span class="required">*</span></label>
          <input type="text" id="word-input" placeholder="例：光陰矢のごとし" required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="reading-input">読み</label>
          <input type="text" id="reading-input" placeholder="例：こういんやのごとし" autocomplete="off">
        </div>

        <div class="form-group">
          <label for="meaning-input">意味やメモ</label>
          <textarea id="meaning-input" rows="3" placeholder="言葉の意味や、なぜ心に残ったかのメモ"></textarea>
        </div>

        <div class="form-group">
          <label for="url-input">参照リンクURL</label>
          <input type="url" id="url-input" placeholder="https://example.com">
        </div>

        <div class="form-group">
          <label for="tag-input">タグ（カンマ区切りで複数入力OK）</label>
          <input type="text" id="tag-input" placeholder="例：ことわざ, 名言, 読書">
        </div>

        <button type="submit" id="save-btn" class="save-btn">釣果を記録する</button>
      </form>
    </section>

    <!-- 検索＆うろ覚え検索エリア -->
    <section class="search-section">
      <input type="text" id="search-input" placeholder="🔍 言葉・読み・メモ・タグから探す...">
    </section>

    <!-- 記録一覧表示エリア -->
    <section class="list-section">
      <h2>🎣 これまでの釣果一覧</h2>
      <div id="word-list" class="word-list">
        <!-- JSでここにカードが追加されます -->
      </div>
    </section>
  </div>

  <!-- スマホ向け一発保存ボタン（固定浮遊表示） -->
  <button type="button" class="floating-save-btn" onclick="document.getElementById('save-btn').click()">
    ✨ ノートに保存
  </button>

  <script src="script.js"></script>
</body>
</html>
